# Local engineering brain: MCP server + Postgres + Qdrant.
# Usage: cp .env.example .env && docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain"]
      interval: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes:
      - qdrant:/qdrant/storage

  brain:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://brain:brain@postgres:5432/brain
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      # Loopback only: the brain has no authentication.
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  qdrant:
