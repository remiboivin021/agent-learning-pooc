name: PR Learning Extractor
description: Build an analysis context from a merged pull request and extract candidate lessons with an OpenCode agent.

inputs:
  github_token:
    description: Token with contents:read and pull-requests:read.
    required: true
  pr_number:
    description: PR number. Defaults to the number from the pull_request event.
    required: false
  repository:
    description: owner/name. Defaults to the current repository.
    required: false
  output_path:
    description: Where to write context.json.
    required: false
    default: context.json
  token_budget:
    description: Approximate token budget for diffs.
    required: false
    default: "60000"
  openrouter_api_key:
    description: OpenRouter key. When empty, only context.json is produced (no analysis).
    required: false
  model:
    description: OpenCode model in provider/model form.
    required: false
    default: openrouter/anthropic/claude-sonnet-4.5
  lessons_path:
    description: Where to write lessons.json.
    required: false
    default: lessons.json

outputs:
  skipped:
    description: "true when the PR was not eligible (not merged, bot, revert)."
  context_path:
    description: Path to the generated context.json.

runs:
  using: docker
  image: Dockerfile
